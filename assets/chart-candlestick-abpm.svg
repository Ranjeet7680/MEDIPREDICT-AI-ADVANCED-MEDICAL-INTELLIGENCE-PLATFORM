<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="100%" stop-color="#0f1b2e" />
    </linearGradient>
    <linearGradient id="nocturnalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="surgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="36" y="40" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">🕯️ 24-Hour Ambulatory Blood Pressure Monitoring (ABPM) Interval Movements</text>
  <text x="36" y="62" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Candlestick Chart: Hourly Systolic Intervals (Open, High, Low, Close) • Nocturnal Dipping vs Morning Surge</text>

  <!-- Nocturnal Window Shade (22:00 to 06:00 -> X: 720 to 800 and 100 to 280) -->
  <rect x="100" y="90" width="180" height="300" fill="url(#nocturnalGrad)" />
  <rect x="730" y="90" width="80" height="300" fill="url(#nocturnalGrad)" />
  <!-- Morning Surge Window (06:00 to 09:00 -> X: 280 to 370) -->
  <rect x="280" y="90" width="90" height="300" fill="url(#surgeGrad)" />

  <text x="140" y="112" fill="#60a5fa" font-size="11" font-weight="600" font-family="sans-serif">🌙 Nocturnal Dipping Window</text>
  <text x="290" y="112" fill="#f87171" font-size="11" font-weight="600" font-family="sans-serif">⚡ Morning Surge</text>

  <!-- Grid lines (Systolic mmHg: 80 to 180, scale: 300px for 100 mmHg -> 3px per mmHg) -->
  <!-- 180 mmHg at Y=90 -->
  <!-- 160 mmHg at Y=150 -->
  <!-- 140 mmHg at Y=210 -->
  <!-- 130 mmHg at Y=240 (Target Threshold) -->
  <!-- 120 mmHg at Y=270 -->
  <!-- 100 mmHg at Y=330 -->
  <!-- 80 mmHg at Y=390 -->

  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3">
    <line x1="100" y1="90" x2="810" y2="90" />
    <line x1="100" y1="150" x2="810" y2="150" />
    <line x1="100" y1="210" x2="810" y2="210" />
    <line x1="100" y1="270" x2="810" y2="270" />
    <line x1="100" y1="330" x2="810" y2="330" />
    <line x1="100" y1="390" x2="810" y2="390" />
  </g>

  <!-- Clinical Reference Lines -->
  <!-- 130 mmHg Daytime Threshold -->
  <line x1="100" y1="240" x2="810" y2="240" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="815" y="244" fill="#f59e0b" font-size="10" font-weight="600" font-family="sans-serif">130 (Day Target)</text>

  <!-- 110 mmHg Nocturnal Dipping Target -->
  <line x1="100" y1="300" x2="810" y2="300" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="815" y="304" fill="#10b981" font-size="10" font-weight="600" font-family="sans-serif">110 (Night Target)</text>

  <!-- Y-Axis Labels -->
  <g fill="#94a3b8" font-size="11" text-anchor="end" font-family="monospace">
    <text x="90" y="94">180 mmHg</text>
    <text x="90" y="154">160 mmHg</text>
    <text x="90" y="214">140 mmHg</text>
    <text x="90" y="274">120 mmHg</text>
    <text x="90" y="334">100 mmHg</text>
    <text x="90" y="394">80 mmHg</text>
  </g>

  <!-- Axes lines -->
  <line x1="100" y1="90" x2="100" y2="390" stroke="#475569" stroke-width="1.5" />
  <line x1="100" y1="390" x2="810" y2="390" stroke="#475569" stroke-width="1.5" />

  <!-- Candlesticks (24 hours: 00:00 to 23:00) -->
  <!-- X spacing: approx 29.5 px per hour. Base X = 115 + i * 29 -->

  <!-- Hour 00 (Night, Dip): High=116(Y=282), Low=102(Y=324), Open=112(Y=294), Close=105(Y=315) - Bullish Drop (Teal) -->
  <line x1="115" y1="282" x2="115" y2="324" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="109" y="294" width="12" height="21" rx="2" fill="#14b8a6" />

  <!-- Hour 01: H=112(294), L=98(336), O=106(312), C=102(324) -->
  <line x1="144" y1="294" x2="144" y2="336" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="138" y="312" width="12" height="12" rx="2" fill="#14b8a6" />

  <!-- Hour 02 (Nadir): H=108(306), L=94(348), O=102(324), C=96(342) -->
  <line x1="173" y1="306" x2="173" y2="348" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="167" y="324" width="12" height="18" rx="2" fill="#14b8a6" />

  <!-- Hour 03: H=109(303), L=95(345), O=97(339), C=104(318) - Bearish Up (Amber) -->
  <line x1="202" y1="303" x2="202" y2="345" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="196" y="318" width="12" height="21" rx="2" fill="#f59e0b" />

  <!-- Hour 04: H=114(288), L=100(330), O=104(318), C=108(306) -->
  <line x1="231" y1="288" x2="231" y2="330" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="225" y="306" width="12" height="12" rx="2" fill="#f59e0b" />

  <!-- Hour 05: H=122(264), L=104(318), O=108(306), C=118(276) -->
  <line x1="260" y1="264" x2="260" y2="318" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="254" y="276" width="12" height="30" rx="2" fill="#f59e0b" />

  <!-- Hour 06 (Morning Surge Awakening): H=148(186), L=116(282), O=118(276), C=142(204) - High Surge (Red) -->
  <line x1="289" y1="186" x2="289" y2="282" stroke="#ef4444" stroke-width="1.5" />
  <rect x="283" y="204" width="12" height="72" rx="2" fill="#ef4444" />

  <!-- Hour 07 (Morning Peak): H=162(144), L=138(216), O=142(204), C=156(162) - High Spike -->
  <line x1="318" y1="144" x2="318" y2="216" stroke="#ef4444" stroke-width="1.5" />
  <rect x="312" y="162" width="12" height="42" rx="2" fill="#ef4444" />

  <!-- Hour 08: H=158(156), L=136(222), O=155(165), C=144(198) - Pullback (Teal) -->
  <line x1="347" y1="156" x2="347" y2="222" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="341" y="165" width="12" height="33" rx="2" fill="#14b8a6" />

  <!-- Hour 09 (Workday Starts): H=146(192), L=130(240), O=144(198), C=138(216) -->
  <line x1="376" y1="192" x2="376" y2="240" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="370" y="198" width="12" height="18" rx="2" fill="#14b8a6" />

  <!-- Hour 10: H=144(198), L=128(246), O=138(216), C=140(210) -->
  <line x1="405" y1="198" x2="405" y2="246" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="399" y="210" width="12" height="6" rx="2" fill="#f59e0b" />

  <!-- Hour 11: H=142(204), L=126(252), O=139(213), C=134(228) -->
  <line x1="434" y1="204" x2="434" y2="252" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="428" y="213" width="12" height="15" rx="2" fill="#14b8a6" />

  <!-- Hour 12 (Lunch Stress): H=152(174), L=130(240), O=134(228), C=148(186) -->
  <line x1="463" y1="174" x2="463" y2="240" stroke="#ef4444" stroke-width="1.5" />
  <rect x="457" y="186" width="12" height="42" rx="2" fill="#ef4444" />

  <!-- Hour 13 (Postprandial dip): H=144(198), L=122(264), O=147(189), C=126(252) -->
  <line x1="492" y1="198" x2="492" y2="264" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="486" y="189" width="12" height="63" rx="2" fill="#14b8a6" />

  <!-- Hour 14: H=136(222), L=124(258), O=126(252), C=132(234) -->
  <line x1="521" y1="222" x2="521" y2="258" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="515" y="234" width="12" height="18" rx="2" fill="#f59e0b" />

  <!-- Hour 15: H=138(216), L=125(255), O=132(234), C=135(225) -->
  <line x1="550" y1="216" x2="550" y2="255" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="544" y="225" width="12" height="9" rx="2" fill="#f59e0b" />

  <!-- Hour 16: H=142(204), L=127(249), O=134(228), C=139(213) -->
  <line x1="579" y1="204" x2="579" y2="249" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="573" y="213" width="12" height="15" rx="2" fill="#f59e0b" />

  <!-- Hour 17 (Evening Rush): H=154(168), L=134(228), O=139(213), C=150(180) -->
  <line x1="608" y1="168" x2="608" y2="228" stroke="#ef4444" stroke-width="1.5" />
  <rect x="602" y="180" width="12" height="33" rx="2" fill="#ef4444" />

  <!-- Hour 18: H=150(180), L=132(234), O=149(183), C=138(216) -->
  <line x1="637" y1="180" x2="637" y2="234" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="631" y="183" width="12" height="33" rx="2" fill="#14b8a6" />

  <!-- Hour 19 (Dinner): H=140(210), L=128(246), O=138(216), C=132(234) -->
  <line x1="666" y1="210" x2="666" y2="246" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="660" y="216" width="12" height="18" rx="2" fill="#14b8a6" />

  <!-- Hour 20: H=135(225), L=122(264), O=132(234), C=125(255) -->
  <line x1="695" y1="225" x2="695" y2="264" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="689" y="234" width="12" height="21" rx="2" fill="#14b8a6" />

  <!-- Hour 21 (Wind down): H=128(246), L=118(276), O=125(255), C=120(270) -->
  <line x1="724" y1="246" x2="724" y2="276" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="718" y="255" width="12" height="15" rx="2" fill="#14b8a6" />

  <!-- Hour 22 (Sleep start): H=122(264), L=110(300), O=120(270), C=114(288) -->
  <line x1="753" y1="264" x2="753" y2="300" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="747" y="270" width="12" height="18" rx="2" fill="#14b8a6" />

  <!-- Hour 23 (Deep sleep): H=118(276), L=104(318), O=114(288), C=108(306) -->
  <line x1="782" y1="276" x2="782" y2="318" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="776" y="288" width="12" height="18" rx="2" fill="#14b8a6" />

  <!-- X-Axis Labels (00h, 04h, 08h, 12h, 16h, 20h, 23h) -->
  <g fill="#94a3b8" font-size="11" text-anchor="middle" font-family="monospace">
    <text x="115" y="410">00:00</text>
    <text x="202" y="410">03:00</text>
    <text x="289" y="410">06:00</text>
    <text x="376" y="410">09:00</text>
    <text x="463" y="410">12:00</text>
    <text x="550" y="410">15:00</text>
    <text x="637" y="410">18:00</text>
    <text x="724" y="410">21:00</text>
    <text x="782" y="410">23:00</text>
  </g>

  <!-- Legend Bottom -->
  <g transform="translate(100, 440)">
    <!-- Bullish / Dipping Drop -->
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#14b8a6" />
    <text x="22" y="12" fill="#cbd5e1" font-size="11" font-family="sans-serif">Decreasing / Dipper (Open &gt; Close)</text>

    <!-- Bearish / Surge Rise -->
    <rect x="240" y="0" width="14" height="14" rx="2" fill="#ef4444" />
    <text x="262" y="12" fill="#cbd5e1" font-size="11" font-family="sans-serif">Hypertensive Surge (Close &gt; 140 mmHg)</text>

    <rect x="520" y="0" width="14" height="14" rx="2" fill="#f59e0b" />
    <text x="542" y="12" fill="#cbd5e1" font-size="11" font-family="sans-serif">Mild Elevation (Close &gt; Open)</text>
  </g>
</svg>