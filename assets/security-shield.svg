<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b171e" />
      <stop offset="100%" stop-color="#142634" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00635e" />
      <stop offset="100%" stop-color="#00b4a7" />
    </linearGradient>
  </defs>

  <rect width="1000" height="320" rx="14" fill="url(#secBg)" stroke="#1e3a4a" stroke-width="2" />

  <text x="40" y="42" fill="#4ef3e2" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">ENTERPRISE HEALTHCARE COMPLIANCE</text>
  <text x="40" y="70" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">DPDP Act 2023 • HIPAA Security Rule • ReBAC • Cryptographic Audit Trails</text>

  <!-- Pillar 1: ReBAC -->
  <g transform="translate(40, 100)">
    <rect width="210" height="190" rx="10" fill="#10222e" stroke="#00b4a7" stroke-width="1.5" />
    <text x="20" y="32" fill="#4ef3e2" font-family="sans-serif" font-size="13" font-weight="700">ReBAC Authorization</text>
    <text x="20" y="55" fill="#8da3b0" font-family="sans-serif" font-size="11">Care Relationship Validation</text>
    <line x1="20" y1="65" x2="190" y2="65" stroke="#1e3a4a" stroke-width="1" />
    <text x="20" y="88" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Self-Registration role lock</text>
    <text x="20" y="108" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Active Physician-Patient link</text>
    <text x="20" y="128" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Zero unauthenticated uploads</text>
    <text x="20" y="148" fill="#c4d5e0" font-family="sans-serif" font-size="10">• IDOR cross-patient barrier</text>
    <text x="20" y="172" fill="#4ef3e2" font-family="monospace" font-size="10" font-weight="600">verify_patient_access()</text>
  </g>

  <!-- Pillar 2: RLS Policies -->
  <g transform="translate(280, 100)">
    <rect width="210" height="190" rx="10" fill="#10222e" stroke="#2a7bcc" stroke-width="1.5" />
    <text x="20" y="32" fill="#7bc4ff" font-family="sans-serif" font-size="13" font-weight="700">PostgreSQL RLS</text>
    <text x="20" y="55" fill="#8da3b0" font-family="sans-serif" font-size="11">Row Level Security Engine</text>
    <line x1="20" y1="65" x2="190" y2="65" stroke="#1e3a4a" stroke-width="1" />
    <text x="20" y="88" fill="#c4d5e0" font-family="sans-serif" font-size="10">• 20+ tables RLS enforced</text>
    <text x="20" y="108" fill="#c4d5e0" font-family="sans-serif" font-size="10">• FORCE ROW LEVEL SECURITY</text>
    <text x="20" y="128" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Fixed search_path functions</text>
    <text x="20" y="148" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Short-lived 300s signed URLs</text>
    <text x="20" y="172" fill="#7bc4ff" font-family="monospace" font-size="10" font-weight="600">auth.uid() isolation</text>
  </g>

  <!-- Pillar 3: HMAC Audit Logs -->
  <g transform="translate(520, 100)">
    <rect width="210" height="190" rx="10" fill="#10222e" stroke="#8e54e9" stroke-width="1.5" />
    <text x="20" y="32" fill="#c499ff" font-family="sans-serif" font-size="13" font-weight="700">HMAC-SHA256 Audit</text>
    <text x="20" y="55" fill="#8da3b0" font-family="sans-serif" font-size="11">Tamper-Evident Ledger</text>
    <line x1="20" y1="65" x2="190" y2="65" stroke="#1e3a4a" stroke-width="1" />
    <text x="20" y="88" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Cryptographic signing</text>
    <text x="20" y="108" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Append-only table policy</text>
    <text x="20" y="128" fill="#c4d5e0" font-family="sans-serif" font-size="10">• UPDATE/DELETE prohibited</text>
    <text x="20" y="148" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Verifiable checksum stream</text>
    <text x="20" y="172" fill="#c499ff" font-family="monospace" font-size="10" font-weight="600">sign_audit_payload()</text>
  </g>

  <!-- Pillar 4: DPDP Compliance -->
  <g transform="translate(760, 100)">
    <rect width="200" height="190" rx="10" fill="#10222e" stroke="#f59e0b" stroke-width="1.5" />
    <text x="20" y="32" fill="#fcd34d" font-family="sans-serif" font-size="13" font-weight="700">DPDP Act 2023</text>
    <text x="20" y="55" fill="#8da3b0" font-family="sans-serif" font-size="11">Indian Data Protection</text>
    <line x1="20" y1="65" x2="180" y2="65" stroke="#1e3a4a" stroke-width="1" />
    <text x="20" y="88" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Section 6 Consent Manager</text>
    <text x="20" y="108" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Section 11 Data Portability</text>
    <text x="20" y="128" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Section 12 Right to Erasure</text>
    <text x="20" y="148" fill="#c4d5e0" font-family="sans-serif" font-size="10">• Anti-replay timestamp check</text>
    <text x="20" y="172" fill="#fcd34d" font-family="monospace" font-size="10" font-weight="600">data_deletion_requests</text>
  </g>
</svg>
