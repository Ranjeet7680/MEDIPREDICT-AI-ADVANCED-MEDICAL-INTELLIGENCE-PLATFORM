<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="d3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#040813" />
    </linearGradient>

    <linearGradient id="rocGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="d3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes drawCurve {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulsePip {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.5; }
      }
      .roc-curve {
        stroke-dasharray: 400;
        animation: drawCurve 4s ease-out infinite;
      }
      .ml-pip { animation: pulsePip 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="12" fill="url(#d3Bg)" stroke="#1e3a5f" stroke-width="1.2" />

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="0.7" opacity="0.3">
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="280" x2="1000" y2="280" />
    <line x1="0" y1="380" x2="1000" y2="380" />
    <line x1="0" y1="480" x2="1000" y2="480" />
    <line x1="333" y1="0" x2="333" y2="560" />
    <line x1="666" y1="0" x2="666" y2="560" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 42)">
    <rect x="0" y="-12" width="22" height="22" rx="4" fill="#a855f7" />
    <text x="6" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff">03</text>
    <text x="32" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Machine Learning Research Lab &amp; Predictive Diagnostics</text>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">GradientBoostingClassifier (ROC-AUC: 0.962) &bull; SHAP Explainability &bull; MLflow Experiment Tracking</text>
  </g>

  <!-- ==================== BOX 1: BIOMARKER INPUT FEATURES (x: 40) ==================== -->
  <g transform="translate(40, 90)">
    <rect width="260" height="420" rx="10" fill="#061220" stroke="#1e3a5f" stroke-width="1.2" />
    <rect width="260" height="34" rx="10" fill="#1e1b4b" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#c084fc">1. BIOMARKER FEATURE VECTORS</text>

    <!-- Group A: Immunoglobulins -->
    <g transform="translate(14, 48)">
      <rect width="232" height="96" rx="8" fill="#0c172e" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Serological Immunoglobulins</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Quantitative Serum Titers (g/L)</text>
      <line x1="10" y1="42" x2="222" y2="42" stroke="#1e3a5f" stroke-width="1" />
      <text x="12" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#38bdf8">&bull; Serum IgA (tTG / EMA Dominance)</text>
      <text x="12" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#38bdf8">&bull; Serum IgG (Deamidated Gliadin DGP)</text>
      <text x="12" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#38bdf8">&bull; Serum IgM (Primary Immune Response)</text>
    </g>

    <!-- Group B: Clinical Symptoms & History -->
    <g transform="translate(14, 156)">
      <rect width="232" height="114" rx="8" fill="#0c172e" stroke="#818cf8" stroke-width="1" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Clinical &amp; Comorbidity Factors</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Phenotype &amp; Presentation</text>
      <line x1="10" y1="42" x2="222" y2="42" stroke="#1e3a5f" stroke-width="1" />
      <text x="12" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#a5b4fc">&bull; Autoimmune: Type 1 Diabetes</text>
      <text x="12" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#a5b4fc">&bull; GI: Chronic Diarrhoea &amp; Pain</text>
      <text x="12" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#a5b4fc">&bull; Malabsorption: Steatorrhea &amp; Wt Loss</text>
      <text x="12" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#a5b4fc">&bull; Growth: Pediatric Short Stature</text>
    </g>

    <!-- Group C: Demographics & Scaling -->
    <g transform="translate(14, 282)">
      <rect width="232" height="122" rx="8" fill="#0c172e" stroke="#c084fc" stroke-width="1" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Preprocessing Pipeline</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Pipeline: StandardScaler + Impute</text>
      <line x1="10" y1="42" x2="222" y2="42" stroke="#1e3a5f" stroke-width="1" />
      <text x="12" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#e9d5ff">&bull; One-Hot Encoding: Gender &amp; Subtype</text>
      <text x="12" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#e9d5ff">&bull; Interaction Terms: (IgA / IgG Ratio)</text>
      <text x="12" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#e9d5ff">&bull; 80/20 Stratified Train-Test Split</text>
      <text x="12" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#10b981">&bull; N = 2,206 Clinical Serology Records</text>
    </g>
  </g>

  <!-- ==================== BOX 2: MODEL TRAINING & ROC CURVE (x: 370) ==================== -->
  <g transform="translate(370, 90)">
    <rect width="260" height="420" rx="10" fill="#061220" stroke="#a855f7" stroke-width="1.5" filter="url(#d3Glow)" />
    <rect width="260" height="34" rx="10" fill="#3b0764" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f0abfc">2. GRADIENT BOOSTING &amp; ROC-AUC</text>

    <!-- Synthetic ROC Curve Display -->
    <g transform="translate(20, 50)">
      <rect width="220" height="170" rx="8" fill="#080e1e" stroke="#1e293b" stroke-width="1" />
      <!-- Grid in ROC Box -->
      <line x1="25" y1="20" x2="200" y2="20" stroke="#1e293b" stroke-width="0.7" />
      <line x1="25" y1="60" x2="200" y2="60" stroke="#1e293b" stroke-width="0.7" />
      <line x1="25" y1="100" x2="200" y2="100" stroke="#1e293b" stroke-width="0.7" />
      <line x1="25" y1="140" x2="200" y2="140" stroke="#334155" stroke-width="1.2" />
      <line x1="25" y1="20" x2="25" y2="140" stroke="#334155" stroke-width="1.2" />

      <!-- Random Guess Diagonal (dotted) -->
      <line x1="25" y1="140" x2="200" y2="20" stroke="#475569" stroke-width="1" stroke-dasharray="3 3" />

      <!-- High-performance ROC curve path (AUC 0.962) -->
      <path class="roc-curve" d="M 25 140 C 35 40, 70 24, 200 20" fill="none" stroke="url(#rocGrad)" stroke-width="3" filter="url(#d3Glow)" />

      <!-- Labels -->
      <text x="110" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">False Positive Rate (1 - Specificity)</text>
      <text x="12" y="80" text-anchor="middle" transform="rotate(-90 12 80)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#94a3b8">Sensitivity</text>

      <!-- Badge in ROC chart -->
      <rect x="70" y="60" width="115" height="28" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" />
      <text x="128" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#f0abfc">ROC-AUC: 0.962</text>
    </g>

    <!-- Key Performance Metrics Grid -->
    <g transform="translate(14, 234)">
      <rect width="232" height="166" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Validation Metrics Benchmark</text>

      <g transform="translate(14, 32)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Test Accuracy</text>
        <text x="200" y="14" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">94.2%</text>

        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">F1 Classification Score</text>
        <text x="200" y="36" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#10b981">0.938</text>

        <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Brier Reliability Loss</text>
        <text x="200" y="58" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#a855f7">0.0407</text>

        <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">5-Fold Stratified CV Mean</text>
        <text x="200" y="80" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">0.958</text>

        <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Optimal Decision Threshold</text>
        <text x="200" y="102" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#f59e0b">p = 0.42</text>

        <line x1="0" y1="114" x2="204" y2="114" stroke="#1e293b" stroke-width="1" />
        <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#34d399">&bull; Algorithm: GradientBoosting (n_est: 150)</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOX 3: SHAP EXPLAINABILITY & EXPERIMENTS (x: 700) ==================== -->
  <g transform="translate(700, 90)">
    <rect width="260" height="420" rx="10" fill="#061220" stroke="#1e3a5f" stroke-width="1.2" />
    <rect width="260" height="34" rx="10" fill="#1e1b4b" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#c084fc">3. SHAP &amp; EXPERIMENT REGISTRY</text>

    <!-- Section A: SHAP Feature Importance Bars -->
    <g transform="translate(14, 48)">
      <rect width="232" height="170" rx="8" fill="#0c172e" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">SHAP TreeExplainer Factor Attribution</text>
      <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Mean |SHAP value| impact on risk output</text>

      <!-- Bar 1: Serum IgA -->
      <g transform="translate(12, 46)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#e2e8f0">Serum IgA</text>
        <rect x="75" y="0" width="130" height="12" rx="3" fill="#0284c7" />
        <text x="210" y="10" font-family="monospace" font-size="9" fill="#38bdf8">+0.48</text>
      </g>

      <!-- Bar 2: Type 1 Diabetes -->
      <g transform="translate(12, 70)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#e2e8f0">Diabetes T1</text>
        <rect x="75" y="0" width="95" height="12" rx="3" fill="#0369a1" />
        <text x="175" y="10" font-family="monospace" font-size="9" fill="#38bdf8">+0.32</text>
      </g>

      <!-- Bar 3: Chronic Diarrhoea -->
      <g transform="translate(12, 94)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#e2e8f0">Diarrhoea</text>
        <rect x="75" y="0" width="70" height="12" rx="3" fill="#075985" />
        <text x="150" y="10" font-family="monospace" font-size="9" fill="#38bdf8">+0.22</text>
      </g>

      <!-- Bar 4: Steatorrhea -->
      <g transform="translate(12, 118)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#e2e8f0">Sticky Stool</text>
        <rect x="75" y="0" width="50" height="12" rx="3" fill="#0c4a6e" />
        <text x="130" y="10" font-family="monospace" font-size="9" fill="#38bdf8">+0.14</text>
      </g>

      <!-- Bar 5: Patient Age -->
      <g transform="translate(12, 142)">
        <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#e2e8f0">Age Bracket</text>
        <rect x="75" y="0" width="30" height="12" rx="3" fill="#164e63" />
        <text x="110" y="10" font-family="monospace" font-size="9" fill="#38bdf8">+0.08</text>
      </g>
    </g>

    <!-- Section B: MLflow Experiment Registry -->
    <g transform="translate(14, 230)">
      <rect width="232" height="174" rx="8" fill="#0c172e" stroke="#818cf8" stroke-width="1" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">MLflow-Style Experiment Registry</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Model artifacts &amp; hyperparameter runs</text>
      <line x1="10" y1="42" x2="222" y2="42" stroke="#1e3a5f" stroke-width="1" />

      <g transform="translate(10, 52)">
        <rect width="212" height="48" rx="4" fill="#0f172a" />
        <text x="8" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">exp_gradient_boost_v1.0.0</text>
        <text x="8" y="28" font-family="monospace" font-size="8.5" fill="#38bdf8">AUC: 0.962 &bull; Acc: 94.2% &bull; lr: 0.05</text>
        <text x="8" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#10b981">DEPLOYED IN PRODUCTION</text>
      </g>

      <g transform="translate(10, 108)">
        <rect width="212" height="48" rx="4" fill="#0f172a" />
        <text x="8" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">exp_isolation_forest_v1.1.0</text>
        <text x="8" y="28" font-family="monospace" font-size="8.5" fill="#c084fc">Recall: 96.5% &bull; Anomaly Outliers</text>
        <text x="8" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#10b981">ACTIVE BIOCHEMISTRY MONITOR</text>
      </g>
    </g>
  </g>
</svg>
