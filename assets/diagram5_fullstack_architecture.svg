    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="280" x2="1000" y2="280" />
    <line x1="0" y1="380" x2="1000" y2="380" />
    <line x1="0" y1="480" x2="1000" y2="480" />
    <line x1="250" y1="0" x2="250" y2="560" />
