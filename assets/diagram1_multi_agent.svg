<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="d1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#050b18" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="supGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>

    <filter id="d1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="d1SuperGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes orbitPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 0.3; }
      }
      @keyframes radarSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes packetFlow {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .packet-line {
        stroke-dasharray: 8 12;
        animation: packetFlow 2.5s linear infinite;
      }
      .radar-sweep {
        transform-origin: 500px 280px;
        animation: radarSpin 8s linear infinite;
      }
      .orbit-ring {
        transform-origin: 500px 280px;
        animation: orbitPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="560" rx="12" fill="url(#d1Bg)" stroke="#1e3a5f" stroke-width="1.2" />

  <!-- Grid Pattern -->
  <g stroke="#172554" stroke-width="0.7" opacity="0.35">
    <line x1="0" y1="70" x2="1000" y2="70" />
    <line x1="0" y1="140" x2="1000" y2="140" />
    <line x1="0" y1="210" x2="1000" y2="210" />
    <line x1="0" y1="280" x2="1000" y2="280" />
    <line x1="0" y1="350" x2="1000" y2="350" />
    <line x1="0" y1="420" x2="1000" y2="420" />
    <line x1="0" y1="490" x2="1000" y2="490" />
    <line x1="125" y1="0" x2="125" y2="560" />
    <line x1="250" y1="0" x2="250" y2="560" />
    <line x1="375" y1="0" x2="375" y2="560" />
    <line x1="500" y1="0" x2="500" y2="560" />
    <line x1="625" y1="0" x2="625" y2="560" />
    <line x1="750" y1="0" x2="750" y2="560" />
    <line x1="875" y1="0" x2="875" y2="560" />
  </g>

  <!-- Header Section -->
  <g transform="translate(40, 42)">
    <rect x="0" y="-12" width="22" height="22" rx="4" fill="#0284c7" />
    <text x="6" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff">01</text>
    <text x="32" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Autonomous Multi-Agent Clinical Intelligence Orchestration</text>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">Supervisor Orchestrator &bull; 6 Specialized Medical Domain Agents &bull; Human-in-the-Loop Oversight</text>
  </g>

  <!-- Central Orbital Rings -->
  <circle cx="500" cy="280" r="190" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.4" class="orbit-ring" />
  <circle cx="500" cy="280" r="130" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />

  <!-- Radar Sweep Effect -->
  <path d="M 500 280 L 690 280 A 190 190 0 0 0 634 145 Z" fill="#00e5ff" opacity="0.06" class="radar-sweep" />

  <!-- Connection Beams from Central Supervisor to 6 Agents -->
  <!-- 1. Top-Left: Medical Information Agent (x: 230, y: 140) -->
  <path d="M 500 280 Q 360 210 240 140" fill="none" stroke="#00e5ff" stroke-width="2" class="packet-line" filter="url(#d1Glow)" />
  <!-- 2. Top-Right: Medical Report Agent (x: 770, y: 140) -->
  <path d="M 500 280 Q 640 210 760 140" fill="none" stroke="#10b981" stroke-width="2" class="packet-line" filter="url(#d1Glow)" />
  <!-- 3. Mid-Left: Health Monitoring Agent (x: 170, y: 280) -->
  <path d="M 500 280 L 190 280" fill="none" stroke="#38bdf8" stroke-width="2" class="packet-line" filter="url(#d1Glow)" />
  <!-- 4. Mid-Right: Research Agent (x: 830, y: 280) -->
  <path d="M 500 280 L 810 280" fill="none" stroke="#a855f7" stroke-width="2" class="packet-line" filter="url(#d1Glow)" />
  <!-- 5. Bottom-Left: Device Integration Agent (x: 230, y: 420) -->
  <path d="M 500 280 Q 360 350 240 420" fill="none" stroke="#f59e0b" stroke-width="2" class="packet-line" filter="url(#d1Glow)" />
  <!-- 6. Bottom-Right: Healthcare Workflow Agent (x: 770, y: 420) -->
  <path d="M 500 280 Q 640 350 760 420" fill="none" stroke="#f43f5e" stroke-width="2" class="packet-line" filter="url(#d1Glow)" />

  <!-- ==================== CENTRAL SUPERVISOR NODE ==================== -->
  <g transform="translate(500, 280)">
    <circle cx="0" cy="0" r="54" fill="#082f49" stroke="#00e5ff" stroke-width="3" filter="url(#d1SuperGlow)" />
    <circle cx="0" cy="0" r="46" fill="url(#supGrad)" />
    <!-- Center Icon: Supervisor Compass / Brain -->
    <path d="M -16 -6 L 0 -22 L 16 -6 L 0 10 Z" fill="#ffffff" />
    <circle cx="0" cy="14" r="3" fill="#00e5ff" />
    <text y="-2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff">SUPERVISOR</text>
    <text y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#bae6fd">ORCHESTRATOR</text>
    <!-- Status Dot -->
    <circle cx="0" cy="32" r="3.5" fill="#10b981" />
  </g>

  <!-- ==================== 6 SPECIALIZED AGENT NODES ==================== -->

  <!-- 1. Medical Information Agent (Top-Left) -->
  <g transform="translate(140, 95)">
    <rect width="200" height="90" rx="10" fill="url(#agentGrad)" stroke="#00e5ff" stroke-width="1.5" filter="url(#d1Glow)" />
    <circle cx="24" cy="24" r="10" fill="#0369a1" />
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">i</text>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Medical Info Agent</text>
    <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8">PubMed Clinical RAG</text>
    <line x1="16" y1="48" x2="184" y2="48" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; Synthesizes peer-reviewed citations</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; Acute symptom triage detection</text>
  </g>

  <!-- 2. Medical Report Agent (Top-Right) -->
  <g transform="translate(660, 95)">
    <rect width="200" height="90" rx="10" fill="url(#agentGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#d1Glow)" />
    <circle cx="24" cy="24" r="10" fill="#047857" />
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Rx</text>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Medical Report Agent</text>
    <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#34d399">OCR &amp; Biomarker Parser</text>
    <line x1="16" y1="48" x2="184" y2="48" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; PDF/CSV laboratory decomposition</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; Flags abnormal biochemical ranges</text>
  </g>

  <!-- 3. Health Monitoring Agent (Mid-Left) -->
  <g transform="translate(50, 235)">
    <rect width="200" height="90" rx="10" fill="url(#agentGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#d1Glow)" />
    <circle cx="24" cy="24" r="10" fill="#0284c7" />
    <path d="M 18 24 L 21 21 L 24 27 L 27 23 L 30 25" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Monitoring Agent</text>
    <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#7dd3fc">Longitudinal Telemetry</text>
    <line x1="16" y1="48" x2="184" y2="48" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; 7-day moving averages (BP, HR)</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; Physiological outlier alerts</text>
  </g>

  <!-- 4. Research Agent (Mid-Right) -->
  <g transform="translate(750, 235)">
    <rect width="200" height="90" rx="10" fill="url(#agentGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#d1Glow)" />
    <circle cx="24" cy="24" r="10" fill="#7e22ce" />
    <circle cx="24" cy="24" r="5" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Research Agent</text>
    <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#c084fc">Clinical Evidence Grades</text>
    <line x1="16" y1="48" x2="184" y2="48" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; PubMed, CrossRef, OMIM query</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; Evidence Level rating (Grade A-D)</text>
  </g>

  <!-- 5. Device Integration Agent (Bottom-Left) -->
  <g transform="translate(140, 375)">
    <rect width="200" height="90" rx="10" fill="url(#agentGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#d1Glow)" />
    <circle cx="24" cy="24" r="10" fill="#b45309" />
    <circle cx="24" cy="24" r="4" fill="#ffffff" />
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Device Agent</text>
    <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#fcd34d">Protocol Normalization</text>
    <line x1="16" y1="48" x2="184" y2="48" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; Evaluates BLE, MQTT, CoAP</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; Packet loss &amp; calibration checks</text>
  </g>

  <!-- 6. Healthcare Workflow Agent (Bottom-Right) -->
  <g transform="translate(660, 375)">
    <rect width="200" height="90" rx="10" fill="url(#agentGrad)" stroke="#f43f5e" stroke-width="1.5" filter="url(#d1Glow)" />
    <circle cx="24" cy="24" r="10" fill="#be123c" />
    <path d="M 24 18 L 24 30 M 18 24 L 30 24" stroke="#ffffff" stroke-width="2" />
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Workflow Agent</text>
    <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#fda4af">Human MD Governance</text>
    <line x1="16" y1="48" x2="184" y2="48" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; Routes high-risk findings to MDs</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">&bull; Clinician review queue tracking</text>
  </g>

  <!-- Footer Safety Interceptor Badge -->
  <g transform="translate(370, 500)">
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#0f172a" stroke="#00e5ff" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#00e5ff" />
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">AI Safety Layer &bull; Zero Diagnostic Hallucination</text>
  </g>
</svg>
