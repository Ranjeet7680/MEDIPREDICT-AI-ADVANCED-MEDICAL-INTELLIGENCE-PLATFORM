<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="healthyFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="celiacFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cvidFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="14" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="36" y="38" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">📦 Serum Immunoglobulin Distribution (IgA, IgG, IgM)</text>
  <text x="36" y="60" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Box Plot: Median, Interquartile Range (Q1–Q3), Whiskers (1.5×IQR) &amp; Clinical Outliers across Cohorts</text>

  <!-- Plot Area Boundaries: X=100 to 800, Y=90 to 390 (Height 300px) -->
  <!-- Y scale: 0 to 2000 mg/dL. 300px / 2000 = 0.15 px per mg/dL -->
  <!-- 2000 at Y=90 -->
  <!-- 1500 at Y=165 -->
  <!-- 1000 at Y=240 -->
  <!-- 500 at Y=315 -->
  <!-- 0 at Y=390 -->

  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3">
    <line x1="100" y1="90" x2="800" y2="90" />
    <line x1="100" y1="165" x2="800" y2="165" />
    <line x1="100" y1="240" x2="800" y2="240" />
    <line x1="100" y1="315" x2="800" y2="315" />
    <line x1="100" y1="390" x2="800" y2="390" />
  </g>

  <!-- Y-Axis Labels -->
  <g fill="#94a3b8" font-size="11" text-anchor="end" font-family="monospace">
    <text x="90" y="94">2000</text>
    <text x="90" y="169">1500</text>
    <text x="90" y="244">1000</text>
    <text x="90" y="319">500</text>
    <text x="90" y="394">0 mg/dL</text>
  </g>

  <!-- Axes lines -->
  <line x1="100" y1="90" x2="100" y2="390" stroke="#475569" stroke-width="1.5" />
  <line x1="100" y1="390" x2="800" y2="390" stroke="#475569" stroke-width="1.5" />

  <!-- SECTION 1: Serum IgG (Center around X=230) -->
  <text x="230" y="415" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">Serum IgG</text>
  <text x="230" y="432" fill="#64748b" font-size="10" text-anchor="middle" font-family="sans-serif">Ref: 700–1600 mg/dL</text>

  <!-- IgG Normal Reference Band (Y=285 to Y=150) -->
  <rect x="130" y="150" width="200" height="135" fill="#38bdf8" fill-opacity="0.04" />

  <!-- IgG - Healthy Control (X=160): Q1=1020(Y=237), Q3=1380(Y=183), Med=1190(Y=211), Min=780(Y=273), Max=1580(Y=153) -->
  <g>
    <!-- Whisker lines -->
    <line x1="160" y1="183" x2="160" y2="153" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="150" y1="153" x2="170" y2="153" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="160" y1="237" x2="160" y2="273" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="150" y1="273" x2="170" y2="273" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Box -->
    <rect x="145" y="183" width="30" height="54" fill="url(#healthyFill)" stroke="#38bdf8" stroke-width="2" rx="3" />
    <!-- Median -->
    <line x1="145" y1="211" x2="175" y2="211" stroke="#ffffff" stroke-width="2.5" />
    <!-- Outliers -->
    <circle cx="160" cy="138" r="3.5" fill="#38bdf8" />
  </g>

  <!-- IgG - Celiac Enteropathy (X=230): Q1=900(Y=255), Q3=1250(Y=202), Med=1080(Y=228), Min=680(Y=288), Max=1420(Y=177) -->
  <g>
    <line x1="230" y1="202" x2="230" y2="177" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="220" y1="177" x2="240" y2="177" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="230" y1="255" x2="230" y2="288" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="220" y1="288" x2="240" y2="288" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="215" y="202" width="30" height="53" fill="url(#celiacFill)" stroke="#f59e0b" stroke-width="2" rx="3" />
    <line x1="215" y1="228" x2="245" y2="228" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- IgG - CVID Immunodeficiency (X=300): Q1=180(Y=363), Q3=380(Y=333), Med=240(Y=354), Min=60(Y=381), Max=490(Y=316) -->
  <g>
    <line x1="300" y1="333" x2="300" y2="316" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="290" y1="316" x2="310" y2="316" stroke="#ef4444" stroke-width="1.5" />
    <line x1="300" y1="363" x2="300" y2="381" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="290" y1="381" x2="310" y2="381" stroke="#ef4444" stroke-width="1.5" />
    <rect x="285" y="333" width="30" height="30" fill="url(#cvidFill)" stroke="#ef4444" stroke-width="2" rx="3" />
    <line x1="285" y1="354" x2="315" y2="354" stroke="#ffffff" stroke-width="2.5" />
    <!-- Severe outlier near 0 -->
    <circle cx="300" cy="387" r="3.5" fill="#ef4444" />
  </g>


  <!-- SECTION 2: Serum IgA (Center around X=465) -->
  <text x="465" y="415" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">Serum IgA</text>
  <text x="465" y="432" fill="#64748b" font-size="10" text-anchor="middle" font-family="sans-serif">Ref: 70–400 mg/dL</text>

  <!-- IgA Normal Ref band (Y=379 to Y=330) -->
  <rect x="365" y="330" width="200" height="49" fill="#38bdf8" fill-opacity="0.04" />

  <!-- IgA - Healthy (X=395): Q1=140(Y=369), Q3=280(Y=348), Med=210(Y=358), Min=80(Y=378), Max=380(Y=333) -->
  <g>
    <line x1="395" y1="348" x2="395" y2="333" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="385" y1="333" x2="405" y2="333" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="395" y1="369" x2="395" y2="378" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="385" y1="378" x2="405" y2="378" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="380" y="348" width="30" height="21" fill="url(#healthyFill)" stroke="#38bdf8" stroke-width="2" rx="3" />
    <line x1="380" y1="358" x2="410" y2="358" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- IgA - Celiac Enteropathy (X=465) - Characteristic Selective IgA Deficiency Subpopulation -->
  <!-- Q1=10(Y=388), Q3=210(Y=358), Med=45(Y=383), Min=5(Y=389), Max=310(Y=343) -->
  <g>
    <line x1="465" y1="358" x2="465" y2="343" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="455" y1="343" x2="475" y2="343" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="465" y1="388" x2="465" y2="389" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="450" y="358" width="30" height="30" fill="url(#celiacFill)" stroke="#f59e0b" stroke-width="2" rx="3" />
    <line x1="450" y1="383" x2="480" y2="383" stroke="#ffffff" stroke-width="2.5" />
    <!-- Outliers -->
    <circle cx="465" cy="325" r="3.5" fill="#f59e0b" />
    <circle cx="465" cy="318" r="3.5" fill="#f59e0b" />
  </g>

  <!-- IgA - CVID (X=535): Severe Pan-Hypogammaglobulinemia: Med=8(Y=388) -->
  <g>
    <line x1="535" y1="385" x2="535" y2="375" stroke="#ef4444" stroke-width="1.5" />
    <line x1="535" y1="389" x2="535" y2="390" stroke="#ef4444" stroke-width="1.5" />
    <rect x="520" y="382" width="30" height="7" fill="url(#cvidFill)" stroke="#ef4444" stroke-width="2" rx="2" />
    <line x1="520" y1="388" x2="550" y2="388" stroke="#ffffff" stroke-width="2" />
  </g>


  <!-- SECTION 3: Serum IgM (Center around X=700) -->
  <text x="700" y="415" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">Serum IgM</text>
  <text x="700" y="432" fill="#64748b" font-size="10" text-anchor="middle" font-family="sans-serif">Ref: 40–230 mg/dL</text>

  <!-- IgM Normal Ref band (Y=384 to Y=355) -->
  <rect x="600" y="355" width="200" height="29" fill="#38bdf8" fill-opacity="0.04" />

  <!-- IgM - Healthy (X=630): Q1=80(Y=378), Q3=160(Y=366), Med=115(Y=372) -->
  <g>
    <line x1="630" y1="366" x2="630" y2="352" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="620" y1="352" x2="640" y2="352" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="630" y1="378" x2="630" y2="384" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="615" y="366" width="30" height="12" fill="url(#healthyFill)" stroke="#38bdf8" stroke-width="2" rx="3" />
    <line x1="615" y1="372" x2="645" y2="372" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- IgM - Celiac Enteropathy (X=700): Q1=90(Y=376), Q3=175(Y=363), Med=130(Y=370) -->
  <g>
    <line x1="700" y1="363" x2="700" y2="348" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="690" y1="348" x2="710" y2="348" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="700" y1="376" x2="700" y2="382" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="685" y="363" width="30" height="13" fill="url(#celiacFill)" stroke="#f59e0b" stroke-width="2" rx="3" />
    <line x1="685" y1="370" x2="715" y2="370" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="700" cy="336" r="3.5" fill="#f59e0b" />
  </g>

  <!-- IgM - CVID (X=770): Low Q1=15(Y=387), Q3=40(Y=384), Med=22(Y=386) -->
  <g>
    <line x1="770" y1="384" x2="770" y2="378" stroke="#ef4444" stroke-width="1.5" />
    <line x1="770" y1="387" x2="770" y2="389" stroke="#ef4444" stroke-width="1.5" />
    <rect x="755" y="384" width="30" height="4" fill="url(#cvidFill)" stroke="#ef4444" stroke-width="2" rx="1" />
    <line x1="755" y1="386" x2="785" y2="386" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Legend Top Right -->
  <g transform="translate(480, 24)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#38bdf8" />
    <text x="18" y="10" fill="#cbd5e1" font-size="11" font-family="sans-serif">Healthy Cohort (N=2,500)</text>

    <rect x="170" y="0" width="12" height="12" rx="2" fill="#f59e0b" />
    <text x="188" y="10" fill="#cbd5e1" font-size="11" font-family="sans-serif">Celiac Enteropathy (N=420)</text>

    <rect x="330" y="0" width="12" height="12" rx="2" fill="#ef4444" />
    <text x="348" y="10" fill="#cbd5e1" font-size="11" font-family="sans-serif">CVID (N=98)</text>
  </g>
</svg>