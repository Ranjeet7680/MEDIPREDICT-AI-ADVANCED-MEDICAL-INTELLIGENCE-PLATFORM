<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b171e" />
      <stop offset="100%" stop-color="#11222c" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00837b" />
      <stop offset="100%" stop-color="#00b4a7" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5a98" />
      <stop offset="100%" stop-color="#2a7bcc" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3791" />
      <stop offset="100%" stop-color="#8e54e9" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" rx="16" fill="url(#bgGrad)" stroke="#1e3a4a" stroke-width="2" />

  <!-- Title Badge -->
  <rect x="50" y="30" width="220" height="34" rx="17" fill="#00837b" fill-opacity="0.2" stroke="#00b4a7" stroke-width="1.5" />
  <text x="160" y="52" fill="#4ef3e2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SYSTEM ARCHITECTURE</text>
  <text x="50" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800">MediPredict AI Enterprise Healthcare Platform</text>
  <text x="50" y="120" fill="#8da3b0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">High-throughput, HIPAA & DPDP Act 2023 Compliant Biomedical Intelligence Ecosystem</text>

  <!-- Layer 1: Presentation (Next.js) -->
  <g transform="translate(50, 150)">
    <rect width="250" height="250" rx="12" fill="#132633" stroke="#00b4a7" stroke-width="2" />
    <rect x="15" y="15" width="220" height="32" rx="6" fill="url(#tealGrad)" />
    <text x="125" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">PRESENTATION LAYER</text>
    <text x="25" y="75" fill="#4ef3e2" font-family="monospace" font-size="12" font-weight="700">Next.js 14 App Router</text>
    <text x="25" y="95" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Clinical Calm Design System</text>
    <text x="25" y="115" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Real-Time Voice Assistant (13 Lang)</text>
    <text x="25" y="135" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Interactive Lab Biomarker Portal</text>
    <text x="25" y="155" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Clinician Review & Sign-Off Queue</text>
    <text x="25" y="175" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Personal Health Records Vault</text>
    <rect x="25" y="200" width="200" height="28" rx="6" fill="#00837b" fill-opacity="0.3" stroke="#00b4a7" stroke-width="1" />
    <text x="125" y="218" fill="#4ef3e2" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Vercel Serverless Edge</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 300 275 L 340 275" stroke="#00b4a7" stroke-width="3" stroke-dasharray="4,4" />
  <polygon points="340,270 350,275 340,280" fill="#00b4a7" />

  <!-- Layer 2: API & Decision Engine (FastAPI) -->
  <g transform="translate(350, 150)">
    <rect width="250" height="250" rx="12" fill="#132633" stroke="#2a7bcc" stroke-width="2" />
    <rect x="15" y="15" width="220" height="32" rx="6" fill="url(#blueGrad)" />
    <text x="125" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">API & APPLICATION CORE</text>
    <text x="25" y="75" fill="#7bc4ff" font-family="monospace" font-size="12" font-weight="700">FastAPI (Python 3.11)</text>
    <text x="25" y="95" fill="#c4d5e0" font-family="sans-serif" font-size="11">• ReBAC Care Relationship Control</text>
    <text x="25" y="115" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Document Magic-Byte Inspection</text>
    <text x="25" y="135" fill="#c4d5e0" font-family="sans-serif" font-size="11">• In-Memory Sliding Rate Limiting</text>
    <text x="25" y="155" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Emergency Triage Auto-Redirection</text>
    <text x="25" y="175" fill="#c4d5e0" font-family="sans-serif" font-size="11">• HMAC Tamper-Evident Audit</text>
    <rect x="25" y="200" width="200" height="28" rx="6" fill="#0f5a98" fill-opacity="0.3" stroke="#2a7bcc" stroke-width="1" />
    <text x="125" y="218" fill="#7bc4ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Docker / Render / Cloud Run</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 600 275 L 640 275" stroke="#2a7bcc" stroke-width="3" stroke-dasharray="4,4" />
  <polygon points="640,270 650,275 640,280" fill="#2a7bcc" />

  <!-- Layer 3: AI & Machine Learning -->
  <g transform="translate(650, 150)">
    <rect width="250" height="250" rx="12" fill="#132633" stroke="#8e54e9" stroke-width="2" />
    <rect x="15" y="15" width="220" height="32" rx="6" fill="url(#purpleGrad)" />
    <text x="125" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">AI & ML RESEARCH LAB</text>
    <text x="25" y="75" fill="#c499ff" font-family="monospace" font-size="12" font-weight="700">Predictive & Generative AI</text>
    <text x="25" y="95" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Celiac Gradient Booster (AUC 0.962)</text>
    <text x="25" y="115" fill="#c4d5e0" font-family="sans-serif" font-size="11">• TreeSHAP Factor Explainability</text>
    <text x="25" y="135" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Clinical Evidence RAG Engine</text>
    <text x="25" y="155" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Google Gemini 1.5 Multimodal</text>
    <text x="25" y="175" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Multilingual Speech Engine</text>
    <rect x="25" y="200" width="200" height="28" rx="6" fill="#5a3791" fill-opacity="0.3" stroke="#8e54e9" stroke-width="1" />
    <text x="125" y="218" fill="#c499ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Scikit-Learn • Vertex AI</text>
  </g>

  <!-- Connector 3 -->
  <path d="M 900 275 L 940 275" stroke="#8e54e9" stroke-width="3" stroke-dasharray="4,4" />
  <polygon points="940,270 950,275 940,280" fill="#8e54e9" />

  <!-- Layer 4: Data & Storage -->
  <g transform="translate(950, 150)">
    <rect width="200" height="250" rx="12" fill="#132633" stroke="#f59e0b" stroke-width="2" />
    <rect x="15" y="15" width="170" height="32" rx="6" fill="url(#amberGrad)" />
    <text x="100" y="36" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">DATA & STORAGE</text>
    <text x="20" y="75" fill="#fcd34d" font-family="monospace" font-size="12" font-weight="700">PostgreSQL + RLS</text>
    <text x="20" y="95" fill="#c4d5e0" font-family="sans-serif" font-size="11">• 20+ Tables with RLS</text>
    <text x="20" y="115" fill="#c4d5e0" font-family="sans-serif" font-size="11">• ReBAC Relationship Table</text>
    <text x="20" y="135" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Supabase Private Storage</text>
    <text x="20" y="155" fill="#c4d5e0" font-family="sans-serif" font-size="11">• 300s Signed Short URLs</text>
    <text x="20" y="175" fill="#c4d5e0" font-family="sans-serif" font-size="11">• Append-Only Audit Logs</text>
    <rect x="20" y="200" width="160" height="28" rx="6" fill="#b45309" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
    <text x="100" y="218" fill="#fcd34d" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Supabase / Managed PG</text>
  </g>
</svg>
