# Render Blueprint Specification for MediPredict AI Full Stack
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: medipredict-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medipredict-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AUDIT_SIGNING_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: clinical_evidence
      - key: BACKEND_CORS_ORIGINS
        value: "https://medipredict-k2upabmcy-ranjeet7680s-projects.vercel.app,http://localhost:3000"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: "https://affjbuibhbejzzrwdusw.supabase.co"
      - key: SUPABASE_ANON_KEY
        sync: false

databases:
  - name: medipredict-postgres
    databaseName: medipredict
    user: medipredict_admin
    plan: free
